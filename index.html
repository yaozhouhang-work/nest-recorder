<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>巣記録 / Nest Recorder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span class="title"><span data-i18n="app_title"></span> <small><span data-i18n="trial"></span> v0.4.1</small></span>
    <span class="top-right">
      <button id="unexported" class="badge" hidden></button>
      <span id="gps-status" class="gps off"></span>
      <button id="btn-settings" class="icon" aria-label="settings">⚙</button>
    </span>
  </header>

  <div id="map"></div>

  <div id="pick-hint" hidden><span data-i18n="pick_hint"></span> <button id="pick-cancel" data-i18n="cancel"></button></div>

  <nav id="toolbar">
    <button id="btn-add-gps" class="primary" data-i18n="btn_add_gps"></button>
    <button id="btn-locate" data-i18n="btn_locate"></button>
    <button id="btn-add-pick" data-i18n="btn_pick"></button>
    <button id="btn-list" data-i18n="btn_list"></button>
    <button id="btn-data" data-i18n="btn_data"></button>
  </nav>

  <!-- 巣 -->
  <section id="sheet-nest" class="sheet" hidden>
    <div class="sheet-head"><strong id="nest-title"></strong><button class="close" data-close>✕</button></div>
    <h3 class="sub"><span data-i18n="visits"></span> <span id="visit-count"></span></h3>
    <button id="btn-add-visit" class="primary wide" data-i18n="add_visit"></button>
    <ul id="visit-items" class="items"></ul>
    <div id="n-legacy" class="legacy" hidden>
      <h3 class="sub" data-i18n="legacy_text"></h3>
      <p id="n-legacy-text"></p>
      <div id="n-photos" class="photos"></div>
    </div>
    <details id="n-details" class="nest-details"><summary data-i18n="nest_info"></summary>
    <form id="nest-form">
      <div class="row ro"><span data-i18n="location"></span><b id="n-loc"></b></div>
      <div class="row ro"><span data-i18n="gps_raw"></span><b id="n-gps"></b></div>
      <label class="row"><span data-i18n="name_label"></span><input id="n-name" autocomplete="off"></label>
      <label class="row"><span data-i18n="category"></span><select id="n-category" data-options="category"></select></label>
      <label class="row"><span data-i18n="season_result"></span><select id="n-result" data-options="season_result"></select></label>
      <label class="row"><span data-i18n="species"></span>
        <input id="n-species" list="species-list" data-i18n-ph="ph_species" autocomplete="off"></label>
      <datalist id="species-list"></datalist>
      <label class="row"><span data-i18n="nest_type"></span><select id="n-type" data-options="nest_type"></select></label>
      <label class="row"><span data-i18n="height_m"></span><input id="n-height" type="number" inputmode="decimal" step="0.1" min="0"></label>
      <label class="row"><span data-i18n="site"></span><input id="n-site" data-i18n-ph="ph_site"></label>
      <label class="row"><span data-i18n="material"></span><input id="n-material"></label>
      <label class="row"><span data-i18n="note"></span><textarea id="n-note" rows="2"></textarea></label>
      <p class="hint" data-i18n="drag_hint"></p>
      <div class="actions">
        <button type="button" id="n-delete" class="danger" data-i18n="delete"></button>
        <button type="submit" class="primary" data-i18n="save"></button>
      </div>
    </form>
    </details>
    <details id="n-history"><summary data-i18n="history"></summary><ul></ul></details>
  </section>

  <!-- 確認記録 -->
  <section id="sheet-visit" class="sheet" hidden>
    <div class="sheet-head"><strong id="visit-title"></strong><button class="close" data-close>✕</button></div>
    <form id="visit-form">
      <label class="row"><span data-i18n="datetime"></span><input id="v-datetime" type="datetime-local" step="60" required></label>
      <div class="row"><span data-i18n="status"></span><div id="v-status" class="chips" data-options="status"></div></div>
      <label class="row"><span data-i18n="eggs"></span><input id="v-eggs" type="number" inputmode="numeric" min="0" step="1"></label>
      <label class="row"><span data-i18n="chicks"></span><input id="v-chicks" type="number" inputmode="numeric" min="0" step="1"></label>
      <div class="row"><span data-i18n="adult"></span><div id="v-adult" class="chips" data-options="adult"></div></div>
      <label class="row"><span data-i18n="photo_ids"></span><input id="v-photos" data-i18n-ph="ph_photo"></label>
      <label class="row"><span data-i18n="note"></span><textarea id="v-note" rows="2"></textarea></label>
      <p class="hint" data-i18n="blank_hint"></p>
      <div class="actions">
        <button type="button" id="v-delete" class="danger" data-i18n="delete"></button>
        <button type="submit" class="primary" data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- 一覧 -->
  <section id="sheet-list" class="sheet" hidden>
    <div class="sheet-head"><strong><span data-i18n="nest_list"></span> <span id="list-count"></span></strong><button class="close" data-close>✕</button></div>
    <ul id="list-items" class="items"></ul>
  </section>

  <!-- データ -->
  <section id="sheet-data" class="sheet" hidden>
    <div class="sheet-head"><strong data-i18n="data_title"></strong><button class="close" data-close>✕</button></div>
    <p class="warn" data-i18n="data_warn"></p>
    <div class="actions col">
      <button id="exp-all" class="primary" data-i18n="export_all"></button>
    </div>
    <p class="hint" id="exp-last"></p>
    <hr>
    <button id="btn-import" class="wide" data-i18n="import"></button>
    <p class="hint" data-i18n="import_hint"></p>
    <p class="hint" id="import-result"></p>
    <hr>
    <p class="hint" id="storage-status"></p>
  </section>

  <!-- 設定 -->
  <section id="sheet-settings" class="sheet" hidden>
    <div class="sheet-head"><strong data-i18n="settings"></strong><button class="close" data-close>✕</button></div>
    <label class="row"><span data-i18n="language"></span>
      <select id="s-lang"><option value="ja">日本語</option><option value="zh">中文</option><option value="en">English</option></select></label>
    <label class="row"><span data-i18n="recorder_code"></span>
      <input id="s-recorder" maxlength="4" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"></label>
    <p class="hint" data-i18n="recorder_hint"></p>
    <div class="actions"><span></span><button id="s-save" class="primary" data-i18n="save"></button></div>
  </section>

  <!-- モーダル（書き出しのお願い / はじめに） -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <div class="actions col" id="modal-actions"></div>
    </div>
  </div>

  <!-- accept は付けない：スマホでは KMZ の種類が判別されず選べなくなるため。種類は読み込み時に判定 -->
  <input type="file" id="file-import" multiple hidden>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="i18n.js"></script>
  <script src="kmz.js"></script>
  <script src="app.js"></script>
</body>
</html>
