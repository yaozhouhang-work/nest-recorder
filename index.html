<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>巢记录</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span class="title">巢记录 <small>试做版 v0.1</small></span>
    <span id="gps-status" class="gps off">GPS 未开启</span>
  </header>

  <div id="map"></div>

  <div id="pick-hint" hidden>点地图选巢的位置 <button id="pick-cancel">取消</button></div>

  <nav id="toolbar">
    <button id="btn-locate">📍 定位</button>
    <button id="btn-add-gps" class="primary">＋ 在当前位置建巢</button>
    <button id="btn-add-pick">👆 地图点选</button>
    <button id="btn-list">☰ 列表</button>
    <button id="btn-export">⇩ 导出</button>
  </nav>

  <!-- 巢详情 / 编辑 -->
  <section id="sheet" class="sheet" hidden>
    <div class="sheet-head">
      <strong id="sheet-title">巢</strong>
      <button class="close" data-close="sheet">✕</button>
    </div>
    <form id="nest-form">
      <div class="row ro"><span>巢编号</span><b id="f-id"></b></div>
      <div class="row ro"><span>位置</span><b id="f-loc"></b></div>
      <div class="row ro"><span>GPS 原值</span><b id="f-gps"></b></div>
      <label class="row"><span>种</span>
        <input id="f-species" list="species-list" placeholder="例：シジュウカラ" autocomplete="off">
      </label>
      <datalist id="species-list"></datalist>
      <label class="row"><span>备注</span>
        <textarea id="f-note" rows="2" placeholder="巢的位置描述、生境等"></textarea>
      </label>
      <p class="hint">要校正位置：直接拖动地图上的巢标记。</p>
      <div class="actions">
        <button type="button" id="f-delete" class="danger">删除</button>
        <button type="submit" class="primary">保存</button>
      </div>
      <details id="f-history"><summary>修改记录</summary><ul></ul></details>
    </form>
  </section>

  <!-- 列表 -->
  <section id="list" class="sheet" hidden>
    <div class="sheet-head">
      <strong>巢列表 <span id="list-count"></span></strong>
      <button class="close" data-close="list">✕</button>
    </div>
    <ul id="list-items"></ul>
  </section>

  <!-- 导出 -->
  <section id="export" class="sheet" hidden>
    <div class="sheet-head">
      <strong>导出 CSV</strong>
      <button class="close" data-close="export">✕</button>
    </div>
    <p class="hint">数据只存在这台手机的浏览器里。每次调查后请导出备份。</p>
    <div class="actions col">
      <button id="exp-nests" class="primary">nests.csv（巢）</button>
      <button id="exp-edits">edits.csv（修改记录）</button>
      <button id="exp-geojson">nests.geojson（给 QGIS / Google Earth）</button>
    </div>
    <p class="hint" id="exp-last"></p>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
